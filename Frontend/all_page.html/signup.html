<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign-up</title>
    <link rel="stylesheet" href="../All_style.css/signup.css">
</head>
<body>
    <section id="hero-section">
        <div id="contentBox">
            <h3>Create New Account</h3>
            <div class="boxes">
                <label for="Username">Username: </label>
                <br>
                <input id="name" type="text" placeholder="Username">
            </div> 
            <br>
            <div class="boxes">
                <label for="email">Enter E-mail: </label>
                <br>
                <input id="mail" type="text" placeholder="E-mail">
                <button id="G-btn" class="btn">Sign-in with Google</button>
                <br>
                <p id="validity"></p>
            </div>
            <br>
            <div class="boxes">
                <label for="Password">Create Password: </label>
                <br>
                <input id="pass" type="password" placeholder="Create Password">
            </div>    
            <br>
            <button id="signup" class="btn"><a href="#">Submit</a></button>
        </div>
    </section>
    <script src="../all_script.js/signup.js"></script>
</body>
</html>
