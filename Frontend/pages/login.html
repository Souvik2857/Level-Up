<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LogIn-Page</title>
    <link rel="stylesheet" href="../styles/login.css">
</head>
<body>
    <section id="hero-section">
        <div id="login-space">
            <br>
            <br>
            <label for="page-heading"><b>Log-in to your previous account</b></label>
            <div class="box">
                <label for="UserEmail"><b>Email:</b></label>
                <br>
                <input type="text" id="Email" name="UserEmail" placeholder="Enter Email">
            </div>
            <br>
            <div class="box">
                <label for="UserPass"><b>Password:</b></label>
                <br>
                <input type="password" id="password" name="UserPass" placeholder="Enter password">
            </div>
            <br>
            <div class="box">
                <p id="confirm"></p>
                <br>
                <button id="btn">Proceed</button>
                <br>
                <br>
                <div>
                    <a href="./signup.html">Create a new Account</a>
                </div>
            </div>
        </div>
    </section>
    <script src="../scripts/script.js"></script>
</body>
</html>
