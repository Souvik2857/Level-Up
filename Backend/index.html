<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        display: flex;
        height: 100vh;
        width: 100vw;
        justify-content: center;
        align-items: center;
        font-size: 30px;
      }
      .box{
        border: 2px solid black;
        height: 250px;
        width: 350px;
      }
      .heading{
        text-align: center;
        font-size: 22px;
        margin-bottom: 20px;
      }
      .rank{
        font-size: 18px;
        text-align: center;
      }
    </style>
  </head>
  <body class="data">
    <div class="box">
      <div class="heading">
        <p>User name</p>
      </div>
      <div class="rank">
        <p>Your rank is 100 E</p>
        <p>Your rank XP is 100XP</p>
      </div>
    </div>
  </body>
  <script>
    const data = prompt("enter key");
    
    async function getData() {
      const res=await fetch('http://localhost:5000/api/user/dashboard',{method:"POST",headers:{'Content-type':'application/json'},body:JSON.stringify({pin:parseInt(data)})})
      const resdata=await res.json();
      if(resdata){
        console.log(resdata);
        
      }
    }
    
    getData();
  </script>
</html>
